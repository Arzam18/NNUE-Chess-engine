name: Build Kociolek Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build self-contained Android ARM64 NEON engine
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source and original networks
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 file binutils zip

      - name: Locate Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            NDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk"
            test -d "$NDK_ROOT"
            NDK="$NDK_ROOT/$(ls "$NDK_ROOT" | sort -V | tail -n 1)"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"

      - name: Build with embedded NNUE
        shell: bash
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk }}
        run: ./build-android-arm64.sh

      - name: Verify self-contained artifact
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/Kociolek-2.3-Android-ARM64.zip
          if unzip -Z1 dist/Kociolek-2.3-Android-ARM64.zip | grep -q '\.bin$'; then
            echo "::error::Unexpected external network file in final artifact"
            exit 1
          fi
          unzip -p dist/Kociolek-2.3-Android-ARM64.zip build-info.txt | grep -q 'Embedded NNUE: quantised-v14.bin'

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: Kociolek-2.3-Android-ARM64-Embedded-NNUE
          path: dist/Kociolek-2.3-Android-ARM64.zip
          if-no-files-found: error
