
name: Build Kociolek Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "Makefile"
      - "src/**"
      - "tools/**"
      - "*.bin"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64 NEON
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make file binutils python3

      - name: Locate Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_LATEST_HOME:-}"

          if [ -z "$NDK" ] || [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            NDK="${ANDROID_HOME}/ndk/$(ls "${ANDROID_HOME}/ndk" | sort -V | tail -n 1)"
          fi

          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            echo "Android NDK clang++ was not found."
            exit 1
          fi

          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"

      - name: Verify source and network files
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile
          test -f Policy-big.bin
          test -f quantised-64.bin
          test -f quantised-v14.bin

          echo "Repository network files:"
          ls -lh Policy-big.bin quantised-64.bin quantised-v14.bin

          echo "Makefile targets and network references:"
          grep -nE '^(all|clean|clean-embed|embed|build):|EVALFILE|POLICYFILE|embed_policy|march=|x86-64' Makefile || true

      - name: Build ARM64 NEON engine
        shell: bash
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk }}
        run: |
          set -euxo pipefail

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"

          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"

          # Show the actual Makefile before building.
          sed -n '1,240p' Makefile

          # Clean only if these targets exist.
          if make -n clean >/dev/null 2>&1; then
            make clean || true
          fi

          if make -n clean-embed >/dev/null 2>&1; then
            make clean-embed || true
          fi

          # ARMv8-A + NEON; do not use x86-specific instruction flags.
          make -j2 \
            CXX="$CXX" \
            CC="$TOOLCHAIN/aarch64-linux-android24-clang" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PYTHON=python3 \
            TARGET=Kociolek-2.2-android-arm64 \
            EVALFILE=quantised-v14.bin \
            POLICYFILE=Policy-big.bin \
            POLICYFILE_SMALL=quantised-64.bin \
            'CXXFLAGS=-std=c++17 -O3 -DNDEBUG -pthread -march=armv8-a+simd -mtune=cortex-a53 -static-libstdc++'

          mkdir -p dist

          # Locate the generated executable without mistaking a source file
          # or network file for the engine.
          BIN=""

          for candidate in \
            Kociolek-2.2-android-arm64 \
            Kociolek \
            kociolek \
            engine
          do
            if [ -f "$candidate" ] && file "$candidate" | grep -q ELF; then
              BIN="$candidate"
              break
            fi
          done

          if [ -z "$BIN" ]; then
            echo "Expected executable not found. Build outputs:"
            find . -maxdepth 3 -type f -exec file {} \;
            exit 1
          fi

          cp "$BIN" dist/Kociolek-2.2-android-arm64
          chmod +x dist/Kociolek-2.2-android-arm64

          file dist/Kociolek-2.2-android-arm64
          "$TOOLCHAIN/llvm-readelf" -h dist/Kociolek-2.2-android-arm64

      - name: Verify ARM64 architecture
        shell: bash
        run: |
          set -euo pipefail

          BIN=dist/Kociolek-2.2-android-arm64
          TOOLCHAIN="${NDK_PATH:-${ANDROID_NDK_LATEST_HOME}}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          file "$BIN" | tee dist/build-info.txt

          "$TOOLCHAIN/llvm-readelf" -h "$BIN" >> dist/build-info.txt

          grep -q 'AArch64' dist/build-info.txt || {
            echo "ERROR: Output is not an ARM64 executable."
            exit 1
          }

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Kociolek-Android-ARM64-NEON
          path: |
            dist/Kociolek-2.2-android-arm64
            dist/build-info.txt
          if-no-files-found: error
